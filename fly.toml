# civora — Fly.io config
# If the app name is taken on Fly, change it below or use `fly launch` which prompts you.

app = "civora"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID = "{{ env \"NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID\" }}"
    NEXT_PUBLIC_CHAIN_ID = "{{ env \"NEXT_PUBLIC_CHAIN_ID\" }}"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512